<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>وصلني | WASLNY</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#13294b;font-family:Tahoma,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.app{max-width:520px;margin:auto;min-height:100vh;background:#fff;padding-bottom:84px}.hero{height:485px;background:linear-gradient(145deg,#066d91,#4ab2c9 48%,#f0cf89);position:relative;overflow:hidden}.hero:before{content:"";position:absolute;bottom:0;left:0;right:0;height:105px;background:linear-gradient(0deg,#245e76,#72c3cc);border-radius:60% 60% 0 0}.brand{position:relative;text-align:center;padding:100px 10px 0;color:white;text-shadow:0 2px 6px #16445a}.brand strong{display:block;font-size:48px}.brand small{letter-spacing:5px;font-size:13px}.brand p{font-size:14px}.panel{position:relative;background:white;margin:-22px 16px 12px;border-radius:22px;padding:20px 16px;box-shadow:0 8px 30px #10294719}.tabs{display:flex;gap:5px;background:#f0f3f7;border-radius:13px;padding:4px;margin-bottom:20px}.tabs button{flex:1;border:0;border-radius:10px;background:transparent;color:#62718a;padding:11px 2px;font-size:12px}.tabs .active{background:#14385b;color:white}.panel h2{font-size:20px;margin:4px 0 18px}.field{width:100%;text-align:right;display:flex;align-items:center;gap:12px;border:1px solid #e1e7ee;border-radius:14px;background:#fff;margin:10px 0;padding:14px 12px;color:#153553}.field b{font-size:14px}.field small{display:block;color:#8591a1;font-size:12px;margin-top:5px}.pin{font-size:22px}.yellow{width:100%;border:0;border-radius:14px;background:#ffce2e;color:#132f4a;font-weight:bold;padding:16px;margin-top:15px;font-size:17px}.ad{margin:16px;border-radius:18px;padding:20px;background:linear-gradient(120deg,#0b6589,#50a5b0);color:white}.ad strong{font-size:22px}.ad p{font-size:13px}.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 14px}.shortcut{text-align:center;font-size:12px;color:#52657c}.shortcut span{display:block;margin:auto auto 8px;background:#eef4f8;border-radius:15px;padding:13px 0;font-size:22px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:66px;background:#102f50;display:flex;align-items:center;justify-content:space-around;color:#d4e2ee;z-index:900}.nav span{text-align:center;font-size:12px}.nav b{display:block;font-size:20px}.screen{padding:18px}.back{border:0;background:#eef3f7;padding:10px 15px;border-radius:10px}.search{width:100%;padding:14px;border:1px solid #d9e1e9;border-radius:12px;margin:14px 0}.results button{display:block;width:100%;padding:14px;background:white;border:0;border-bottom:1px solid #e7ecf0;text-align:right}.map{height:320px;border-radius:14px;overflow:hidden;margin:12px 0}.hint{font-size:12px;color:#60738a;line-height:1.8}.fare{padding:15px;border-radius:14px;background:#f1f6f9;margin:14px 0}.fare strong{font-size:22px}.cars{display:flex;gap:6px}.cars button{flex:1;border:1px solid #d9e1e9;background:white;border-radius:10px;padding:10px 2px;font-size:12px}.cars .active{border:2px solid #f0bd20;background:#fff8df}.links{display:flex;gap:8px}.links a{flex:1;text-align:center;background:#e9f3fa;border-radius:12px;padding:12px;color:#0a5278;text-decoration:none;font-size:12px}.loading{color:#728095;font-size:13px}
@media(min-width:700px){.hero{height:400px}.brand{padding-top:65px}}.hero{background-image:linear-gradient(180deg,#00436b66,#00678922 60%,#194f68),url("https://images.unsplash.com/photo-1514282401047-d79a71a590e8?auto=format&fit=crop&w=1100&q=80");background-position:center;background-size:cover}.hero:before{display:none}.panel{border-radius:28px}.tabs button{font-weight:bold}.yellow{background:#ffcc08}.ad{background:linear-gradient(110deg,#054566,#1681a5)}.shortcut{background:#fff;border-radius:18px;padding:9px 0;box-shadow:0 4px 12px #18354c16}.nav{border-radius:25px 25px 0 0} .hero{height:auto;aspect-ratio:760/470;background-image:url("assets/waslny-reference-hero.svg?v=23");background-size:100% 100%;background-position:center}.hero .brand{display:none}@media(min-width:700px){.hero{height:auto}} </style></head><body><div id="app" class="app"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const app=document.getElementById('app'),s={pickup:null,dest:null,mode:'now',car:'economy',km:null,mins:null,geo:null};let map=null;
const esc=t=>String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nav(){return '<div class="nav"><span onclick="home()"><b>⌂</b>الرئيسية</span><span onclick="alert(\'الرحلات السابقة تحتاج تسجيل الدخول\')"><b>◷</b>رحلاتي</span><span onclick="alert(\'المحفظة تحتاج ربط نظام الدفع\')"><b>▣</b>المحفظة</span><span onclick="alert(\'الحساب يحتاج نظام تسجيل\')"><b>♙</b>حسابي</span></div>'}
function home(){if(map){map.remove();map=null}app.innerHTML='<div class="hero"><div class="brand"><strong>🚕 وصلني</strong><small>WASLNY</small><p>تكسيك في البصرة... بضغطة زر</p></div></div><div class="panel"><div class="tabs">'+[['now','رحلة فورية'],['later','حجز مسبق'],['repeat','رحلات متكررة']].map(x=>'<button class="'+(s.mode===x[0]?'active':'')+'" onclick="s.mode=\''+x[0]+'\';home()">'+x[1]+'</button>').join('')+'</div><h2>وين تروح اليوم؟</h2><button class="field" onclick="choose(\'pickup\')"><span class="pin">📍</span><span><b>موقع الانطلاق</b><small>'+esc(s.pickup?.name||'حدد موقعك الحالي أو اختاره من الخريطة')+'</small></span></button><button class="field" onclick="choose(\'dest\')"><span class="pin">🏁</span><span><b>الوجهة</b><small>'+esc(s.dest?.name||'ابحث عن المكان أو حدد الدبوس')+'</small></span></button><button class="yellow" onclick="request()">اطلب تكسي الآن ←</button></div><div class="ad"><strong>اكتشف البصرة 🌴</strong><p>مشاويرك اليومية وأماكنك المفضلة ويه وصلني</p></div><div class="shortcuts">'+[['🎁','العروض'],['💳','المحفظة'],['🚕','رحلاتي'],['⭐','المفضلة']].map(x=>'<div class="shortcut" onclick="alert(\'هذه الخدمة قيد التطوير\')"><span>'+x[0]+'</span>'+x[1]+'</div>').join('')+'</div>'+nav()}
function choose(t){if(map){map.remove();map=null}let title=t==='pickup'?'موقع الانطلاق':'الوجهة';app.innerHTML='<div class="screen"><button class="back" onclick="home()">← رجوع</button><h2>اختيار '+title+'</h2>'+(t==='pickup'?'<button class="field" onclick="gps()">📍 استخدم موقعي الحالي</button>':'')+'<input id="q" class="search" placeholder="اكتب اسم المنطقة أو المكان في البصرة"><div id="results" class="results"></div><p class="hint">أو حرّك الخريطة حتى يصير الدبوس على الموقع المطلوب.</p><div id="map" class="map"></div><button class="yellow" onclick="pickMap()">تأكيد موقع الدبوس</button></div>'+nav();map=L.map('map').setView([30.5085,47.7804],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);let marker=L.marker(map.getCenter()).addTo(map);map.on('move',()=>marker.setLatLng(map.getCenter()));window.target=t;let timer;document.getElementById('q').oninput=e=>{clearTimeout(timer);let q=e.target.value.trim();if(q.length<3)return;timer=setTimeout(()=>search(q),400)}}
async function search(q){let el=document.getElementById('results');el.innerHTML='<p class="loading">جاري البحث...</p>';try{let r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=7&countrycodes=iq&accept-language=ar&q='+encodeURIComponent(q));let data=await r.json();el.innerHTML=data.map((p,i)=>'<button onclick="selectResult('+i+')">'+esc(p.display_name)+'</button>').join('')||'<p class="hint">ما حصلنا نتائج. جرّب اسم آخر أو الخريطة.</p>';window.matches=data}catch(e){el.textContent='تعذر البحث، جرّب اختيار الموقع من الخريطة'}}
function selectResult(i){let p=window.matches[i];save({lat:+p.lat,lon:+p.lon,name:p.display_name})}
function pickMap(){let p=map.getCenter();save({lat:p.lat,lon:p.lng,name:'موقع محدد على الخريطة'})}
function gps(){if(!navigator.geolocation){alert('المتصفح لا يدعم الموقع');return}navigator.geolocation.getCurrentPosition(p=>save({lat:p.coords.latitude,lon:p.coords.longitude,name:'موقعي الحالي'}),()=>alert('فعّل إذن الموقع من إعدادات المتصفح'),{enableHighAccuracy:true,timeout:15000})}
function save(p){s[window.target]=p;home()}
function request(){if(!s.pickup){choose('pickup');return}if(!s.dest){choose('dest');return}trip()}
const prices={economy:[1500,450,35,3000],comfort:[2000,550,45,4000],family:[2500,700,55,5000]};function fare(type){let p=prices[type];return Math.ceil(Math.max(p[3],p[0]+s.km*p[1]+s.mins*p[2])/250)*250}
async function trip(){if(map){map.remove();map=null}app.innerHTML='<div class="screen"><button class="back" onclick="home()">← رجوع</button><h2>تفاصيل الرحلة</h2><p class="loading">جاري حساب المسافة والأجرة عبر مسار القيادة...</p></div>'+nav();try{let a=s.pickup,b=s.dest;let r=await fetch('https://router.project-osrm.org/route/v1/driving/'+a.lon+','+a.lat+';'+b.lon+','+b.lat+'?overview=false');let d=await r.json();if(!d.routes?.length)throw Error('No route');s.km=d.routes[0].distance/1000;s.mins=d.routes[0].duration/60;renderTrip()}catch(e){app.innerHTML='<div class="screen"><button class="back" onclick="home()">← رجوع</button><h2>تعذر حساب الرحلة</h2><p>لم نتمكن من حساب مسار القيادة حاليا. جرّب مرة ثانية.</p><button class="yellow" onclick="trip()">إعادة المحاولة</button></div>'+nav()}}
function waze(p){return 'https://waze.com/ul?ll='+p.lat+','+p.lon+'&navigate=yes'}
function renderTrip(){app.innerHTML='<div class="screen"><button class="back" onclick="home()">← رجوع</button><h2>تفاصيل الرحلة</h2><p>📍 '+esc(s.pickup.name)+'</p><p>🏁 '+esc(s.dest.name)+'</p><div class="fare">المسافة: '+s.km.toFixed(1)+' كم · الوقت التقريبي: '+Math.round(s.mins)+' دقيقة<br><br>الأجرة التقديرية<br><strong>'+fare(s.car).toLocaleString('en-US')+' دينار</strong></div><h3>اختر نوع السيارة</h3><div class="cars">'+[['economy','اقتصادية'],['comfort','مريحة'],['family','عائلية']].map(x=>'<button class="'+(s.car===x[0]?'active':'')+'" onclick="s.car=\''+x[0]+'\';renderTrip()">'+x[1]+'<br>'+fare(x[0]).toLocaleString('en-US')+'</button>').join('')+'</div><p class="hint">الوقت تقريبي ولا يشمل ازدحام المرور المباشر. الأسعار تجريبية حتى اعتماد التسعيرة.</p><div class="links"><a target="_blank" rel="noopener" href="'+waze(s.pickup)+'">الموقع على Waze</a><a target="_blank" rel="noopener" href="'+waze(s.dest)+'">الوجهة على Waze</a></div><button class="yellow" onclick="alert(\'هذه نسخة تجريبية. تأكيد الطلب وإرساله للكباتن يحتاج خادم حجز فعلي.\')">تأكيد طلب التكسي</button></div>'+nav()}
home();if('serviceWorker'in navigator){navigator.serviceWorker.getRegistrations().then(a=>a.forEach(x=>x.unregister()));caches.keys().then(a=>a.forEach(x=>caches.delete(x)))}
</script></body></html>
